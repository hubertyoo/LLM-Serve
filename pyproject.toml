[project]
name = "llm-serve"
version = "0.1.0"
description = "YAML-driven launcher for vLLM and SGLang model servers"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["llm_serve*"]
